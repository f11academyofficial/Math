<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan Singapore Math Anak 4–6 Tahun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A41;--sky:#2F7FD1;--sun:#FFC93C;--paper:#F4F9FF;--card:#fff;--ok:#2E9E6B;--no:#E0594B;--line:#CFE0F5}
@media (prefers-color-scheme:dark){:root{--ink:#EAF2FF;--paper:#101B2D;--card:#18273F;--line:#2C4163;--sky:#5BA2EE}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:500;min-height:100vh;padding:16px 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.7rem;line-height:1.15;margin:8px 0 4px}
.sub{margin:0 0 16px;opacity:.8}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tab{font:700 1rem Nunito,sans-serif;padding:12px 6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;cursor:pointer}
.tab[aria-selected=true]{background:var(--sky);border-color:var(--sky);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--sun)}
.dot.now{outline:2px solid var(--sky)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px 16px;text-align:center}
.q{font-family:'Baloo 2',sans-serif;font-weight:600;font-size:1.3rem;margin:0 0 12px}
.vis{font-size:2.1rem;line-height:1.5;min-height:80px;display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:center;align-items:center;margin-bottom:12px}
.vis .op{font-family:'Baloo 2',sans-serif;font-size:2.4rem;color:var(--sky);padding:0 6px}
.vis .grp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:170px}
.vis .box{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border:3px dashed var(--sky);border-radius:14px;font-family:'Baloo 2',sans-serif;font-size:2rem;color:var(--sky)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{font:800 2rem 'Baloo 2',sans-serif;min-height:68px;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;cursor:pointer}
.opt:active{transform:scale(.97)}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--no);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:1.6em;margin:12px 0 0;font-weight:700}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.btn{font:800 1.1rem 'Baloo 2',sans-serif;background:var(--sky);color:#fff;border:0;border-radius:14px;padding:12px 20px;margin:6px;cursor:pointer}
.btn.alt{background:var(--sun);color:#1B2A41}
.stars{font-size:2.4rem;margin:6px 0}
.share{margin-top:24px;text-align:center}
.share p{margin:0 0 8px;font-weight:700}
.share .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sbtn{font:700 .95rem Nunito,sans-serif;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
.sbtn.wa{background:#25D366;border-color:#25D366;color:#0B3D1F}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.opt.bad{animation:none}}
</style>
</head>
<body>
<main>
<h1>Latihan Singapore Math</h1>
<p class="sub">Untuk anak usia 4–6 tahun. Belajar angka, pola, dan bentuk lewat gambar. Dampingi anak, ya.</p>
<div class="tabs" role="tablist" aria-label="Pilih permainan">
  <button class="tab" role="tab" data-m="hitung" aria-selected="true">🍎 Hitung</button>
  <button class="tab" role="tab" data-m="pola" aria-selected="false">🔁 Pola</button>
  <button class="tab" role="tab" data-m="bentuk" aria-selected="false">🔺 Bentuk</button>
</div>
<div class="bar"><span id="prog"></span><div class="dots" id="dots" aria-hidden="true"></div></div>
<section class="card" id="stage" aria-live="polite"></section>
<div class="share">
  <p>Bagikan ke teman dan keluarga</p>
  <div class="row">
    <a class="sbtn wa" id="s-wa" target="_blank" rel="noopener">WhatsApp</a>
    <a class="sbtn" id="s-fb" target="_blank" rel="noopener">Facebook</a>
    <a class="sbtn" id="s-x" target="_blank" rel="noopener">X</a>
    <a class="sbtn" id="s-tg" target="_blank" rel="noopener">Telegram</a>
    <button class="sbtn" id="s-native" hidden>Bagikan lainnya</button>
    <button class="sbtn" id="s-copy">Salin tautan</button>
  </div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const FRUIT=['🍎','🍓','🍊','🍌','🍇','🥕'];
const TOTAL=10;
let mode='hitung',n=0,score=0,tries=0,cur=null,locked=false;

function numOpts(ans,max){
  const s=new Set([ans]);
  while(s.size<4){const v=Math.max(0,Math.min(max,ans+R(-3,3)));s.add(v)}
  return shuf([...s]).map(v=>({l:String(v),v}));
}
const objs=(e,k)=>`<span class="grp">${e.repeat(k)}</span>`;

const GEN={
hitung(){
  const e=pick(FRUIT),t=R(0,3);
  if(t===0){const k=R(1,10);return{q:`Ada berapa ${e} ?`,vis:objs(e,k),opts:numOpts(k,10),ans:k}}
  if(t===1){const a=R(1,5),b=R(1,5);return{q:'Berapa jumlahnya?',vis:`${objs(e,a)}<span class="op">+</span>${objs(e,b)}`,opts:numOpts(a+b,10),ans:a+b}}
  if(t===2){const a=R(3,9),b=R(1,a-1);return{q:'Ada berapa yang tersisa?',vis:`${objs(e,a-b)}${objs('❌',b)}`.replace(/❌/g,'✖️'),opts:numOpts(a-b,10),ans:a-b,note:`${a} dikurangi ${b}`}}
  const w=R(3,9),a=R(1,w-1);
  return{q:`${w} dipecah jadi ${a} dan berapa?`,vis:`<span class="box">${w}</span><span class="op">=</span><span class="box">${a}</span><span class="op">+</span><span class="box">?</span>`,opts:numOpts(w-a,10),ans:w-a}
},
pola(){
  const sets=[['🔴','🔵','🟡'],['🐱','🐶','🐰'],['⭐','🌙','☀️'],['🔺','🟦','⚪']];
  const it=shuf(pick(sets)),pats=[[0,1],[0,0,1],[0,1,1],[0,1,2]],p=pick(pats);
  const L=p.length*2+R(1,p.length-1||1),seq=[];
  for(let i=0;i<=L;i++)seq.push(it[p[i%p.length]]);
  const ans=seq[L],shown=seq.slice(0,L);
  const used=[...new Set(p.map(i=>it[i]))];
  const extra=it.filter(x=>!used.includes(x));
  const o=shuf([...used,...extra.slice(0,1)]).map(x=>({l:x,v:x}));
  return{q:'Gambar apa yang datang berikutnya?',vis:shown.join(' ')+' <span class="box">?</span>',opts:o,ans}
},
bentuk(){
  const S=['🔺','🟦','🟡','⭐','🟩'];
  if(R(0,1)){
    const [t,a,b]=shuf(S),k=R(1,6),cnt=R(1,5)+R(0,2),others=[];
    for(let i=0;i<k;i++)others.push(t);
    for(let i=0;i<cnt;i++)others.push(pick([a,b]));
    return{q:`Ada berapa ${t} ?`,vis:`<span class="grp" style="max-width:260px">${shuf(others).join('')}</span>`,opts:numOpts(k,9),ans:k}
  }
  const [a,b]=shuf(S),pos=R(0,4),row=[0,1,2,3,4].map(i=>i===pos?b:a);
  const o=shuf([a,b,...shuf(S.filter(x=>x!==a&&x!==b)).slice(0,2)]).map(x=>({l:x,v:x}));
  return{q:'Mana yang berbeda sendiri?',vis:row.join(' '),opts:o,ans:b}
}};

function dots(){
  $('#dots').innerHTML=Array.from({length:TOTAL},(_,i)=>`<span class="dot ${i<n?'on':''} ${i===n?'now':''}"></span>`).join('');
  $('#prog').textContent=`Soal ${Math.min(n+1,TOTAL)} dari ${TOTAL}`;
}
function render(){
  dots();
  if(n>=TOTAL)return done();
  cur=GEN[mode]();tries=0;locked=false;
  $('#stage').innerHTML=`<p class="q">${cur.q}</p><div class="vis">${cur.vis}</div>
  <div class="opts">${cur.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.l}</button>`).join('')}</div>
  <p class="msg" id="msg"></p>`;
  $('#stage').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
  if(locked)return;
  const o=cur.opts[+b.dataset.i],m=$('#msg');
  if(o.v===cur.ans){
    locked=true;b.classList.add('good');
    if(tries===0)score++;
    m.className='msg ok';m.textContent=pick(['Hebat!','Benar sekali!','Pintar!','Mantap!']);
    setTimeout(()=>{n++;render()},900);
  }else{
    tries++;b.classList.add('bad');b.disabled=true;
    m.className='msg no';m.textContent='Belum tepat. Coba lagi, pelan-pelan.';
  }
}
function done(){
  const st=score>=9?3:score>=6?2:1;
  const txt=score>=9?'Luar biasa!':score>=6?'Bagus sekali!':'Terus berlatih, kamu pasti bisa!';
  $('#stage').innerHTML=`<div class="stars" aria-label="${st} bintang">${'⭐'.repeat(st)}</div>
  <p class="q">${txt}</p><p>Benar langsung: ${score} dari ${TOTAL}</p>
  <button class="btn" id="again">Main lagi</button>`;
  $('#again').onclick=()=>{n=0;score=0;render()};
  $('#again').focus();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  mode=t.dataset.m;n=0;score=0;render();
});
render();

(function(){
  const url=location.href.split('#')[0],title='Latihan Singapore Math untuk anak usia 4–6 tahun',
        txt=title+' – gratis dan seru. Coba di sini: ';
  $('#s-wa').href='https://wa.me/?text='+encodeURIComponent(txt+url);
  $('#s-fb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url);
  $('#s-x').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(title)+'&url='+encodeURIComponent(url);
  $('#s-tg').href='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(title);
  if(navigator.share){
    const nb=$('#s-native');nb.hidden=false;
    nb.onclick=()=>navigator.share({title,text:title,url}).catch(()=>{});
  }
  const cb=$('#s-copy');
  cb.onclick=async()=>{
    try{await navigator.clipboard.writeText(url);cb.textContent='Tautan tersalin';}
    catch(e){prompt('Salin tautan ini:',url);}
    setTimeout(()=>cb.textContent='Salin tautan',2000);
  };
})();
</script>
</body>
</html>
